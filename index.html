<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anu HTML Forms</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <script
      src="https://kit.fontawesome.com/9315e45218.js"
      crossorigin="anonymous"
    ></script>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <form>
      <div class="d-flex justify-content-center align-items-center vh-100">
        <div class="border my-auto w-75 align-items-center">
          <div class="border bg-light fs-5 fw-bold mb-2 p-3">
            <span class=" ">Payment form example</span>
          </div>
          <div
            class="text-danger-emphasis bg-danger-subtle border border-danger-subtle fs-6 fw-semibold rounded-2 m-2"
          >
            <span class="p-2">some fields are missing</span>
          </div>
          <!-- *************** -->

          <div class=" row g-2 m-2 pb-2">
            <div class="col-12 col-md-5">
              <label for="InputCardNo" class="form-label">Card#</label>
              <input
                type="number"
                class="required form-control"
                placeholder="xxxx-xxxx-xxxx-xxxx"
              />
            </div>
            <div class="col-12 col-md-4">
              <label for="InputCvcNo" class="form-label">cvc#</label>
              <input
                type="number"
                class="required form-control"
                placeholder="0000"
              />
            </div>
            <div class="col-12 col-md-3">
              <label for="InputAmount" class="form-label">Amount</label>
              <div>
                <div class="input-group-text input-group-sm">
                  <span class="input-group-text">$</span>
                  <input
                    type="number"
                    class="required form-control"
                    placeholder="0.00"
                  />
                </div>
              </div>
            </div>
          </div>

          <!--**************** -->
          <div class=" row g-1 m-2">
            <div class="col-12 col-md-6  justify-content-center px-2">
              <!--first col-->

              <label for="InputName" class="form-label">First Name</label>
              <input
                type="text"
                class="form-control form-control-sm"
                id="InputName"
                aria-describedby="nameHelp"
              />
              <!-- <div id="nameHelp" class="form-text">We'll never share your name with anyone else.</div> -->

              <label for="InputCity" class="form-label">city</label>
              <input
                type="text"
                class="form-control form-control-sm"
                id="InputCity"
                aria-describedby="cityHelp"
              />
              <!-- <div id="cityHelp" class="form-text">We'll never share your city with anyone else.</div> -->

              <div class="my-3">
                <label for="">We accept</label>
                <div class="row">
                  <div class="col-12 col-md-6 d-flex justify-content-around bg-secondary  ms-2 ">
                    <div class="form-check d-flex m-0 p-0">
                      <input
                        class="form-check-input ms-0 my-auto me-1"
                        type="radio"
                        name="radioDefault"
                        id="radioDefault1"
                      />
                      <label class="form-check-label" for="radioDefault1">
                        <i class="fa-brands fa-cc-mastercard fa-lg"></i>
                      </label>
                    </div>
                    <div class="form-check d-flex  m-0 p-0">
                      <input
                        class="form-check-input ms-0 my-auto me-1"
                        type="radio"
                        name="radioDefault"
                        id="radioDefault2"
                        checked
                      />
                      <label class="form-check-label m-0" for="radioDefault2">
                        <i class="fa-brands fa-cc-visa fa-lg"></i>
                      </label>
                    </div>
                    <div class="form-check d-flex  m-0 p-0">
                      <input
                        class="form-check-input ms-0 my-auto me-1"
                        type="radio"
                        name="radioDefault"
                        id="radioDefault1"
                      />
                      <label class="form-check-label m-0" for="radioDefault1">
                        <i class="fa-brands fa-cc-diners-club fa-lg"></i>
                      </label>
                    </div>
                    <div class="form-check d-flex  m-0 p-0">
                      <input
                        class="form-check-input ms-0 my-auto me-1"
                        type="radio"
                        name="radioDefault"
                        id="radioDefault2"
                        checked
                      />
                      <label class="form-check-label m-0" for="radioDefault2">
                        <i class="fa-brands fa-cc-amex fa-lg"></i>
                      </label>
                    </div>
                  </div>
                  <div class="col-0 col-md-6">                    
                  </div>
                </div>
              </div>
            </div>
            <div
              class="col-12 col-md-6  justify-content-center px-2"
            >
              <!--second col-->

              <label for="InputLastName" class="form-label">Last Name</label>
              <input
                type="text"
                class="form-control form-control-sm"
                id="InputLastName"
                aria-describedby="LastNameHelp"
              />
              <!-- <div id="cityHelp" class="form-text">We'll never share your city with anyone else.</div> -->

              <div class="d-flex row mt-3 mx-auto  rounded-1">
                <div class="col-12 col-md-6 mb-3">
                  <label for="stateSelect" class="form-label">State</label>
                  <select
                    class="form-select form-select-sm"
                    id="stateSelect"
                    aria-label="select a state"
                  >
                    <option selected disabled>Pick a state</option>
                    <option value="AL">Alabama</option>
                    <option value="AK">Alaska</option>
                    <option value="AZ">Arizona</option>
                    <option value="AR">Arkansas</option>
                    <option value="CA">California</option>
                    <option value="CO">Colorado</option>
                  </select>
                </div>
                <div class="col-12 col-md-6">
                  <label for="InputPostalCode" class="form-label"
                    >Postal Code</label
                  >
                  <input
                    id="InputPostalCode"
                    type="text"
                    class="form-control form-control-sm"
                  />
                </div>
              </div>

              <div class="mx-auto my-auto  rounded-1">
                <label for="InputPaymentNotes" class="form-label"
                  >Message</label
                >
                <textarea
                  col="80"
                  rows="3"
                  name="paymentNotes"
                  class="form-control"
                  id="InputPaymentNotes"
                ></textarea>
              </div>
            </div>
          </div>

          <div class="d-flex border bg-light justify-content-end mt-2 p-2">
            <!-- <div class="col-auto"> -->
            <button
              type="button"
              class="btn btn-secondary btn-sm me-2"
              aria-label="cancel"
            >
              Cancel
            </button>
            <!-- </div> -->
            <!-- <div class="col-auto"> -->
            <button
              type="button"
              class="btn btn-primary btn-sm"
              aria-label="send"
            >
              send
            </button>
            <!-- </div> -->
          </div>
        </div>
      </div>
    </form>

    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
